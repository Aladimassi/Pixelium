name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Guardrail tests
        run: npm run test:guardrails -w @pixelium/consent-broker

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agents/requirements.txt

      - name: Install Python agent dependencies
        run: pip install -r services/agents/requirements.txt

      - name: Python agent tests
        run: npm run test:agents

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env for compose
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_build_only_root
          MYSQL_PASSWORD=ci_build_only_user
          MYSQL_DATABASE=pixelium_consent
          MYSQL_USER=pixelium
          JWT_SECRET=ci_jwt_secret_for_docker_build_only_32chars
          GROQ_API_KEY=
          PUBLIC_APP_URL=http://localhost
          EOF

      - name: Build Docker images
        run: docker compose build
