name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip waiting for CI (emergency deploy only)
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          find . -name '*.tsbuildinfo' -delete
          npm run build

      - name: Create deploy archive
        run: |
          bash scripts/create-deploy-archive.sh
          test -s pixelium-deploy.tar.gz
          tar -tzf pixelium-deploy.tar.gz | head -20

      - name: Upload and deploy to Azure VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AZURE_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.AZURE_HOST }}
          DEPLOY_USER: ${{ secrets.AZURE_USER }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "::error::AZURE_HOST and AZURE_USER secrets are required."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${SSH_PRIVATE_KEY_B64}" ]; then
            echo "Using AZURE_SSH_PRIVATE_KEY_B64"
            echo "$SSH_PRIVATE_KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          elif [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "Using AZURE_SSH_PRIVATE_KEY"
            echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "::error::Set AZURE_SSH_PRIVATE_KEY_B64 (recommended) or AZURE_SSH_PRIVATE_KEY in repository secrets."
            exit 1
          fi

          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::SSH private key secret is invalid after decode."
            exit 1
          fi
          FINGERPRINT="$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          echo "Deploy key fingerprint: ${FINGERPRINT}"
          echo "Expected fingerprint:     SHA256:uPQKOxLKAQY/xDqwxkpHyDx92cyDt2kTMVgG3ZjdGxs"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          SSH_OPTS=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o IdentitiesOnly=yes)

          echo "Testing SSH connectivity to ${DEPLOY_USER}@${DEPLOY_HOST}..."
          if ! ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "echo SSH_OK"; then
            echo "::error::SSH authentication failed. Fingerprints must match. Prefer AZURE_SSH_PRIVATE_KEY_B64 to avoid paste corruption."
            exit 255
          fi

          scp "${SSH_OPTS[@]}" pixelium-deploy.tar.gz scripts/remote-deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/"

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x ~/remote-deploy.sh && bash ~/remote-deploy.sh"

      - name: Verify production health
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://pixelium.duckdns.org/broker/health}"
          for i in $(seq 1 12); do
            if curl -fsS "$URL" | grep -q '"status"'; then
              echo "Production health OK: $URL"
              curl -fsS "$URL"
              exit 0
            fi
            echo "Waiting for production health ($i/12)..."
            sleep 10
          done
          echo "Production health check failed: $URL"
          exit 1
