name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip waiting for CI (emergency deploy only)
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          find . -name '*.tsbuildinfo' -delete
          npm run build

      - name: Create deploy archive
        run: |
          bash scripts/create-deploy-archive.sh
          test -s pixelium-deploy.tar.gz
          tar -tzf pixelium-deploy.tar.gz | head -20

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.AZURE_HOST }}
          DEPLOY_USER: ${{ secrets.AZURE_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::AZURE_SSH_PRIVATE_KEY is missing. Add the full private key to repo or production environment secrets."
            exit 1
          fi
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "::error::AZURE_HOST and AZURE_USER secrets are required."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::AZURE_SSH_PRIVATE_KEY is not a valid OpenSSH private key (check newlines and BEGIN/END lines)."
            exit 1
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Upload bundle and deploy script
        env:
          DEPLOY_HOST: ${{ secrets.AZURE_HOST }}
          DEPLOY_USER: ${{ secrets.AZURE_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            pixelium-deploy.tar.gz scripts/remote-deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/"

      - name: Run remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.AZURE_HOST }}
          DEPLOY_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod +x ~/remote-deploy.sh && bash ~/remote-deploy.sh"

      - name: Verify production health
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://pixelium.duckdns.org/broker/health}"
          for i in $(seq 1 12); do
            if curl -fsS "$URL" | grep -q '"status"'; then
              echo "Production health OK: $URL"
              curl -fsS "$URL"
              exit 0
            fi
            echo "Waiting for production health ($i/12)..."
            sleep 10
          done
          echo "Production health check failed: $URL"
          exit 1
