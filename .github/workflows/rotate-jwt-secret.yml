name: Rotate JWT Secret

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rotate even if current secret looks strong
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rotate JWT_SECRET on Azure VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.AZURE_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.AZURE_HOST }}
          DEPLOY_USER: ${{ secrets.AZURE_USER }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          DEPLOY_HOST="$(echo "${DEPLOY_HOST}" | tr -d '\r\n\t ')"
          DEPLOY_USER="$(echo "${DEPLOY_USER}" | tr -d '\r\n\t ')"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${SSH_PRIVATE_KEY_B64}" ]; then
            echo "$SSH_PRIVATE_KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          elif [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "::error::Set AZURE_SSH_PRIVATE_KEY_B64 or AZURE_SSH_PRIVATE_KEY"
            exit 1
          fi

          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o IdentitiesOnly=yes)

          scp "${SSH_OPTS[@]}" scripts/ensure-jwt-secret.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/"

          FORCE_FLAG=""
          if [ "${FORCE}" = "true" ]; then FORCE_FLAG="--force"; fi

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x ~/ensure-jwt-secret.sh && ~/ensure-jwt-secret.sh ${FORCE_FLAG} && cd ~/pixelium && docker compose up -d --build broker && sleep 8 && curl -sf http://localhost/broker/health"

      - name: Verify production health
        run: |
          URL="${{ secrets.PRODUCTION_HEALTH_URL }}"
          URL="${URL:-https://pixelium.duckdns.org/broker/health}"
          curl -fsS "$URL"
